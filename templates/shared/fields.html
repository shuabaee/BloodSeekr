{% load ui %}{% if form.non_field_errors %}<div class="errorlist nonfield" role="alert">{{ form.non_field_errors }}</div>{% endif %}
<div class="fields">{% for field in form %}{% if field.is_hidden %}{{ field }}{% else %}<div class="field{% if field.errors %} has-error{% endif %}">
<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span><span class="sr-only">(required)</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endif %}{% endfor %}</div>
